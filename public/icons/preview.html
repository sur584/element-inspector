<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Element Inspector - 图标预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 40px;
    }
    h1 { margin-bottom: 8px; font-size: 24px; }
    .subtitle { color: #666; margin-bottom: 32px; }
    .icon-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .icon-card img {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px;
    }
    .icon-card .label {
      font-size: 13px;
      color: #666;
    }
    .notes {
      margin-top: 40px;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      max-width: 600px;
    }
    .notes h2 { font-size: 16px; margin-bottom: 8px; }
    .notes ul { padding-left: 20px; }
    .notes li { margin-bottom: 4px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>Element Inspector - AI Helper</h1>
  <p class="subtitle">插件图标预览</p>

  <div class="icon-grid">
    <div class="icon-card">
      <img src="icon.svg" alt="SVG icon" width="16" height="16" />
      <span class="label">16 x 16</span>
    </div>
    <div class="icon-card">
      <img src="icon.svg" alt="SVG icon" width="32" height="32" />
      <span class="label">32 x 32</span>
    </div>
    <div class="icon-card">
      <img src="icon.svg" alt="SVG icon" width="48" height="48" />
      <span class="label">48 x 48</span>
    </div>
    <div class="icon-card">
      <img src="icon.svg" alt="SVG icon" width="128" height="128" />
      <span class="label">128 x 128</span>
    </div>
  </div>

  <div class="notes">
    <h2>说明</h2>
    <ul>
      <li>SVG 图标可在任意尺寸下保持清晰，适合作为占位图标使用。</li>
      <li>正式发布前请导出为 PNG 格式（16、32、48、128 四个尺寸）。</li>
      <li>推荐工具：<a href="https://realfavicongenerator.net/" target="_blank">Real Favicon Generator</a> 或 Inkscape 导出。</li>
    </ul>
  </div>
</body>
</html>
